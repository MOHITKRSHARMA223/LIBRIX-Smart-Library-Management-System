spring.application.name=LIBRIX
server.port=${LIBRIX_PORT:8080}
spring.datasource.url=${LIBRIX_DB_URL:jdbc:h2:file:./data/librix}
spring.datasource.username=${LIBRIX_DB_USER:sa}
spring.datasource.password=${LIBRIX_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${LIBRIX_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
spring.h2.console.enabled=false
