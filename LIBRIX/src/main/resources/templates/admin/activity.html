<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Activity logs</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">ADMINISTRATION</span><h2>Activity logs</h2></div></header><section class="page"><div class="page-head"><div><h1>Recent system activity</h1><p>Administrative audit trail for changes and operations.</p></div></div><div class="table-wrap"><table><thead><tr><th>When</th><th>User</th><th>Action</th><th>Module</th><th>Description</th></tr></thead><tbody><tr th:each="log : ${logs}"><td th:text="${log.createdAt}">Time</td><td th:text="${log.user != null ? log.user.username : 'System'}">User</td><td th:text="${log.action}">Action</td><td th:text="${log.module}">Module</td><td th:text="${log.description}">Description</td></tr><tr th:if="${#lists.isEmpty(logs)}"><td colspan="5">No activity has been recorded yet.</td></tr></tbody></table></div></section></main></div></body></html>
