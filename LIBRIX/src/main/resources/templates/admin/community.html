<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Community moderation | LIBRIX</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{fragments/admin-navigation :: sidebar}"></aside><main class="admin-main"><header class="admin-top"><div><span class="admin-kicker">ADMIN PORTAL / COMMUNITY</span><h2>Student submissions</h2></div></header><section class="admin-page"><div class="admin-table"><table><thead><tr><th>Review</th><th>Student</th><th>Rating</th><th>Comment</th></tr></thead><tbody><tr th:each="review : ${reviews}"><td th:text="${review.book.title}">Book</td><td th:text="${review.user.username}">Student</td><td th:text="${review.rating}">5</td><td th:text="${review.comment}">Comment</td></tr></tbody></table></div><div class="admin-table community-admin-table"><table><thead><tr><th>Exchange listing</th><th>Student</th><th>Details</th><th>Action</th></tr></thead><tbody><tr th:each="listing : ${listings}"><td th:text="${listing.title}">Title</td><td th:text="${listing.user.username}">Student</td><td th:text="${listing.description}">Details</td><td><form method="post" th:action="@{|/admin/community/exchange/${listing.id}/close|}"><button class="admin-btn compact danger" type="submit">Close</button></form></td></tr></tbody></table></div><div class="admin-table"><table><thead><tr><th>Research paper</th><th>Subject</th><th>Authors</th><th>Abstract</th></tr></thead><tbody><tr th:each="paper : ${papers}"><td th:text="${paper.title}">Title</td><td th:text="${paper.subject}">Subject</td><td th:text="${paper.authors}">Authors</td><td th:text="${paper.abstractText}">Abstract</td></tr></tbody></table></div></section></main></div></body></html>
