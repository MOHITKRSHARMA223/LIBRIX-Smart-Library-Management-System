<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Operations insights | LIBRIX</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{fragments/admin-navigation :: sidebar}"></aside><main class="admin-main"><header class="admin-top"><div><span class="admin-kicker">ADMIN PORTAL / INSIGHTS</span><h2>Operations health</h2></div></header><section class="admin-page"><div class="admin-page-head"><div><h1>Library health at a glance.</h1><p>Use these signals to prioritize today's work.</p></div></div><section class="admin-insights"><article><span>Inventory utilization</span><strong th:text="|${inventoryUtilization}%|">0%</strong></article><article><span>Today's seat bookings</span><strong th:text="${todaySeats}">0</strong></article><article><span>Due in 3 days</span><strong th:text="${dueSoonLoans}">0</strong></article><article><span>Low-stock titles</span><strong th:text="${lowStockBooks}">0</strong></article></section><a class="admin-badge" th:href="@{/admin/dashboard}">Back to dashboard</a></section></main></div></body></html>
