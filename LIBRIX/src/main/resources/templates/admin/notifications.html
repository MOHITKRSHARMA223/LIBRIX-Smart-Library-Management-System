<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Notifications</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">ADMINISTRATION</span><h2>Notifications</h2></div></header><section class="page"><div class="page-head"><div><h1>System notifications</h1><p>Review announcements and operational alerts.</p></div></div><div class="table-wrap"><table><thead><tr><th>Category</th><th>Title</th><th>Message</th><th>Created</th><th></th></tr></thead><tbody><tr th:each="notification : ${notifications}"><td th:text="${notification.category}">SYSTEM</td><td th:text="${notification.title}">Title</td><td th:text="${notification.message}">Message</td><td th:text="${notification.createdAt}">Time</td><td><form th:if="${!notification.read}" method="post" th:action="@{/admin/notifications/{id}/read(id=${notification.id})}"><button class="btn secondary" type="submit">Mark read</button></form><span th:if="${notification.read}" class="badge">READ</span></td></tr></tbody></table></div></section></main></div></body></html>
