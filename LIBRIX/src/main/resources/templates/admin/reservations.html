<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Reservations</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{fragments/admin-navigation :: sidebar}"></aside><main class="admin-main"><header class="admin-top"><div><span class="admin-kicker">SERVICE DESK / QUEUE</span><h2>Reservations</h2></div></header><section class="admin-page"><div class="admin-page-head"><div><h1>Book waitlist</h1><p>Prepare unavailable titles for students as copies return.</p></div></div><div class="admin-table"><table><thead><tr><th>Book</th><th>Student</th><th>Requested</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="reservation : ${reservations}"><td th:text="${reservation.book.title}">Book</td><td th:text="${reservation.member.fullName}">Student</td><td th:text="${reservation.requestedAt}">Date</td><td><span class="admin-badge" th:text="${reservation.status}">REQUESTED</span></td><td><form th:if="${reservation.status.name() == 'REQUESTED'}" method="post" th:action="@{/admin/reservations/{id}/ready(id=${reservation.id})}" class="inline-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="admin-btn compact" type="submit">Mark ready</button></form><form th:if="${reservation.status.name() == 'REQUESTED' || reservation.status.name() == 'READY'}" method="post" th:action="@{/admin/reservations/{id}/cancel(id=${reservation.id})}" class="inline-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="admin-btn compact danger" type="submit">Cancel</button></form></td></tr><tr th:if="${#lists.isEmpty(reservations)}"><td colspan="5">No reservation requests are waiting.</td></tr></tbody></table></div></section></main></div></body></html>
