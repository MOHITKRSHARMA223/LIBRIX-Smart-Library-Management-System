<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Seat bookings</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{fragments/admin-navigation :: sidebar}"></aside><main class="admin-main"><header class="admin-top"><div><span class="admin-kicker">SPACE OPERATIONS</span><h2>Seat bookings</h2></div></header><section class="admin-page"><div class="admin-page-head"><div><h1>Quiet zone schedule</h1><p>Monitor demand and help students find focused space.</p></div></div><div class="admin-table"><table><thead><tr><th>Student</th><th>Seat</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody><tr th:each="booking : ${bookings}"><td th:text="${booking.user.username}">student</td><td th:text="${booking.seatLabel}">A-01</td><td th:text="${booking.bookingDate}">Date</td><td th:text="|${booking.startTime} – ${booking.endTime}|">Time</td><td th:text="${booking.status}">CONFIRMED</td></tr><tr th:if="${#lists.isEmpty(bookings)}"><td colspan="5">No seat bookings yet.</td></tr></tbody></table></div></section></main></div></body></html>
