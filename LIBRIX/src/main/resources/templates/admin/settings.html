<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Settings</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">ADMINISTRATION</span><h2>Library settings</h2></div></header><section class="page"><div class="page-head"><div><h1>Library settings</h1><p>Only super administrators can change these values.</p></div></div><form class="form-card" method="post" th:action="@{/admin/settings}"><div class="field"><label for="settingKey">Setting key</label><input id="settingKey" name="settingKey" placeholder="policy.borrowing-days" required></div><div class="field"><label for="settingValue">Value</label><input id="settingValue" name="settingValue" required></div><button class="btn" type="submit">Save setting</button></form><br><div class="table-wrap"><table><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody><tr th:each="setting : ${settings}"><td th:text="${setting.settingKey}">Key</td><td th:text="${setting.settingValue}">Value</td></tr></tbody></table></div></section></main></div></body></html>
