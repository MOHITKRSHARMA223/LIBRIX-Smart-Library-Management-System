<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Study plans</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{fragments/admin-navigation :: sidebar}"></aside><main class="admin-main"><header class="admin-top"><div><span class="admin-kicker">STUDENT SUCCESS</span><h2>Study plans</h2></div></header><section class="admin-page"><div class="admin-page-head"><div><h1>Student focus activity</h1><p>See how learners are turning library time into measurable study goals.</p></div></div><div class="admin-table"><table><thead><tr><th>Student</th><th>Focus goal</th><th>Date</th><th>Duration</th><th>Status</th></tr></thead><tbody><tr th:each="item : ${plans}"><td th:text="${item.user.username}">student</td><td th:text="${item.title}">Goal</td><td th:text="${item.scheduledDate}">Date</td><td th:text="|${item.durationMinutes} min|">45 min</td><td th:text="${item.completed ? 'COMPLETED' : 'OPEN'}">OPEN</td></tr><tr th:if="${#lists.isEmpty(plans)}"><td colspan="5">No study plans yet.</td></tr></tbody></table></div></section></main></div></body></html>
