<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Student accounts</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><div class="admin-shell"><aside th:replace="~{fragments/admin-navigation :: sidebar}"></aside><main class="admin-main"><header class="admin-top"><div><span class="admin-kicker">PEOPLE / ACCESS CONTROL</span><h2>Student accounts</h2></div></header><section class="admin-page"><div class="admin-page-head"><div><h1>Review student access</h1><p>Approve registrations, suspend accounts, and keep the student portal trusted.</p></div></div><div class="admin-table"><table><thead><tr><th>Username</th><th>Role</th><th>Account state</th><th>Actions</th></tr></thead><tbody><tr th:each="user : ${users}"><td th:text="${user.username}">student</td><td th:text="${user.role.label()}">Student</td><td><span class="admin-badge" th:classappend="${user.active ? ' success' : ' warning'}" th:text="${user.active ? 'ACTIVE' : 'PENDING'}">PENDING</span></td><td><form th:if="${user.role.name() == 'STUDENT' && !user.active}" method="post" th:action="@{/admin/users/{id}/approve(id=${user.id})}" class="inline-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="admin-btn compact" type="submit">Approve</button></form><form th:if="${user.role.name() == 'STUDENT' && user.active}" method="post" th:action="@{/admin/users/{id}/suspend(id=${user.id})}" class="inline-form"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="admin-btn compact danger" type="submit">Suspend</button></form></td></tr></tbody></table></div></section></main></div></body></html>
