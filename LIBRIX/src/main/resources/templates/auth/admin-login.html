<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX Admin Portal</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body class="admin-auth"><main class="admin-auth-grid"><section class="admin-welcome"><span>LIBRIX / ADMIN</span><h1>Library operations, with clarity.</h1><p>Manage people, inventory, circulation, and policy from one secure workspace.</p></section><section class="admin-auth-card"><form method="post" th:action="@{/authenticate}"><span class="admin-kicker">SECURE STAFF ACCESS</span><h2>Administrator sign in</h2><p class="muted">Authorised librarians and administrators only.</p><p class="error" th:if="${param.error}">Invalid staff credentials.</p><div class="admin-field"><label for="username">Username</label><input id="username" name="username" required autofocus></div><div class="admin-field"><label for="password">Password</label><input id="password" name="password" type="password" required></div><button class="admin-btn" type="submit">Open admin portal</button><a class="text-link" th:href="@{/student/login}">Student portal sign in</a></form></section></main></body></html>
