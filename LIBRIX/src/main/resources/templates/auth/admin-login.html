<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX Admin Portal</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body class="admin-auth"><main class="admin-auth-grid"><section class="admin-welcome"><span>LIBRIX / ADMIN</span><h1>Library operations, with clarity.</h1><p>Manage people, inventory, circulation, and policy from one secure workspace.</p></section><section class="admin-auth-card"><form method="post" th:action="@{/authenticate}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><span class="admin-kicker">SECURE STAFF ACCESS</span><h2>Administrator sign in</h2><p class="muted">Authorised librarians and administrators only.</p><p class="error" th:if="${param.error}">Invalid staff credentials.</p><div class="admin-field"><label for="username">Username</label><input id="username" name="username" required autofocus></div><div class="admin-field"><label for="password">Password</label><div class="password-shell"><input class="password-toggle" id="admin-login-password-toggle" type="checkbox"><label class="password-toggle-label" for="admin-login-password-toggle" aria-label="Show or hide password"><svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2C5.7 6.8 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.2-.5 4.5-1.1M14.4 6.2C19.2 6.9 21.5 12 21.5 12s-1.2 2.1-3.2 3.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></label><input id="password" name="password" type="text" autocomplete="current-password" required></div></div><button class="admin-btn" type="submit">Open admin portal</button><a class="text-link" th:href="@{/student/login}">Student portal sign in</a></form></section></main></body></html>
