<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Sign in</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth-page"><section class="auth-brand"><h1>LIBRIX</h1><p>Smart Library. Smarter Learning.</p><p>One calm workspace for books, members, and every learning journey.</p></section><section class="auth-form"><form class="auth-card" method="post" th:action="@{/login}"><h2>Welcome back</h2><p class="eyebrow">Sign in to continue to your library workspace.</p><p class="notice" th:if="${param.error}">Invalid username or password.</p><p class="notice" th:if="${param.logout}" style="color:#198f68">You have been signed out.</p><div class="field"><label for="username">Username</label><input id="username" name="username" required autofocus></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required></div><button class="btn" type="submit">Sign in</button></form></section></main></body></html>
