<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Sign in</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="auth-page"><section class="auth-brand"><h1>LIBRIX</h1><p>Smart Library. Smarter Learning.</p><p>One calm workspace for books, members, and every learning journey.</p></section><section class="auth-form"><form class="auth-card" method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Welcome back</h2><p class="eyebrow">Sign in to continue to your library workspace.</p><p class="notice" th:if="${param.error}">Invalid username or password.</p><p class="notice" th:if="${param.logout}" style="color:#198f68">You have been signed out.</p><div class="field"><label for="username">Username</label><input id="username" name="username" required autofocus></div><div class="field"><label for="password">Password</label><div class="password-shell"><input class="password-toggle" id="staff-login-password-toggle" type="checkbox"><label class="password-toggle-label" for="staff-login-password-toggle" aria-label="Show or hide password"><svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2C5.7 6.8 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.2-.5 4.5-1.1M14.4 6.2C19.2 6.9 21.5 12 21.5 12s-1.2 2.1-3.2 3.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></label><input id="password" name="password" type="text" autocomplete="current-password" required></div></div><button class="btn" type="submit">Sign in</button></form></section></main></body></html>
