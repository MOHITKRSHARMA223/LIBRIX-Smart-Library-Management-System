<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX Student Portal</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body class="student-auth"><main class="student-auth-grid"><section class="student-welcome"><span class="student-mark">LIBRIX</span><p class="student-kicker">YOUR DIGITAL LIBRARY</p><h1>Find your next chapter.</h1><p>Explore the collection, keep your reading life organised, and stay ahead of every due date.</p></section><section class="student-auth-card"><form method="post" th:action="@{/authenticate}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Student sign in</h2><p class="muted">Use your student account to enter your personal library.</p><p class="error" th:if="${param.error}">We could not verify those credentials.</p><div class="student-field"><label for="username">Student ID or email</label><input id="username" name="username" required autofocus></div><div class="student-field"><label for="password">Password</label><input id="password" name="password" type="password" required></div><button class="student-btn" type="submit">Enter my library</button><a class="text-link" th:href="@{/admin/login}">Staff and administrator sign in</a></form></section></main></body></html>
