<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Create account</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body class="student-auth"><main class="student-auth-grid"><section class="student-welcome"><a class="student-mark" th:href="@{/student/login}">LIBRIX</a><p class="student-kicker">UNIVERSITY LIBRARY MEMBERSHIP</p><h1>Make the stacks feel like home.</h1><p>Create your personal library account. A librarian will review your registration before access is activated.</p><img class="auth-illustration" th:src="@{/images/library-hero.svg}" alt="Illustration of a modern library reading room"></section><section class="student-auth-card"><form method="post" th:action="@{/student/register}" th:object="${registration}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><h2>Create your account</h2><p class="muted">Join the LIBRIX learning community.</p><div class="student-field"><label for="fullName">Full name</label><input id="fullName" th:field="*{fullName}" required><small class="error" th:errors="*{fullName}"></small></div><div class="student-field"><label for="email">University email</label><input id="email" type="email" th:field="*{email}" required><small class="error" th:errors="*{email}"></small></div><div class="student-field"><label for="username">Username</label><input id="username" th:field="*{username}" required><small class="error" th:errors="*{username}"></small></div><div class="student-field"><label for="phone">Phone (optional)</label><input id="phone" th:field="*{phone}"></div><div class="student-field"><label for="password">Password</label><div class="password-shell"><input class="password-toggle" id="student-register-password-toggle" type="checkbox"><label class="password-toggle-label" for="student-register-password-toggle" aria-label="Show or hide password"><svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2C5.7 6.8 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.2-.5 4.5-1.1M14.4 6.2C19.2 6.9 21.5 12 21.5 12s-1.2 2.1-3.2 3.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></label><input id="password" type="text" autocomplete="new-password" th:field="*{password}" required></div><small class="error" th:errors="*{password}"></small></div><div class="student-field"><label for="confirmPassword">Confirm password</label><div class="password-shell"><input class="password-toggle" id="student-register-confirm-toggle" type="checkbox"><label class="password-toggle-label" for="student-register-confirm-toggle" aria-label="Show or hide confirmed password"><svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg><svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2C5.7 6.8 2.5 12 2.5 12s3.5 6 9.5 6c1.7 0 3.2-.5 4.5-1.1M14.4 6.2C19.2 6.9 21.5 12 21.5 12s-1.2 2.1-3.2 3.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></label><input id="confirmPassword" type="text" autocomplete="new-password" th:field="*{confirmPassword}" required></div><small class="error" th:errors="*{confirmPassword}"></small></div><button class="student-btn" type="submit">Submit registration</button><a class="text-link" th:href="@{/student/login}">Already have an account? Sign in</a></form></section></main></body></html>
