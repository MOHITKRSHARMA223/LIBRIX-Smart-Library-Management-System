<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Add book</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">CATALOG</span><h2>New book</h2></div></header><section class="page"><form class="form-card" method="post" th:action="@{/books}" th:object="${book}"><div class="field"><label for="title">Title</label><input id="title" th:field="*{title}" required><small th:errors="*{title}"></small></div><div class="field"><label for="author">Author</label><input id="author" th:field="*{author}" required></div><div class="field"><label for="isbn">ISBN</label><input id="isbn" th:field="*{isbn}"></div><div class="field"><label for="category">Category</label><input id="category" th:field="*{category}"></div><div class="field"><label for="totalCopies">Total copies</label><input id="totalCopies" type="number" min="0" th:field="*{totalCopies}" required></div><div class="field"><label for="shelfLocation">Shelf location</label><input id="shelfLocation" th:field="*{shelfLocation}"></div><div class="form-actions"><button class="btn" type="submit">Save book</button><a class="btn secondary" th:href="@{/books}">Cancel</a></div></form></section></main></div></body></html>
