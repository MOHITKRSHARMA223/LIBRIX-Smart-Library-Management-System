<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Books</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">CATALOG</span><h2>Book inventory</h2></div></header><section class="page"><div class="page-head"><div><h1>Books</h1><p>Search availability and maintain the collection.</p></div><a class="btn" th:href="@{/books/new}">Add book</a></div><form class="toolbar" method="get" th:action="@{/books}"><input name="query" th:value="${query}" placeholder="Search title or author"><button class="btn secondary" type="submit">Search</button></form><div class="table-wrap"><table><thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Availability</th><th>Action</th></tr></thead><tbody><tr th:each="book : ${books}"><td><strong th:text="${book.title}">Title</strong><br><span class="eyebrow" th:text="${book.isbn}">ISBN</span></td><td th:text="${book.author}">Author</td><td th:text="${book.category}">Category</td><td><span class="badge" th:classappend="${!book.available} ? ' out' : ''" th:text="|${book.availableCopies} / ${book.totalCopies} copies|">0 / 0</span></td><td><form method="post" th:action="@{/books/{id}/delete(id=${book.id})}"><button class="btn danger" type="submit">Delete</button></form></td></tr></tbody></table></div></section></main></div></body></html>
