<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Borrowing</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">OPERATIONS</span><h2>Borrowing</h2></div></header><section class="page"><div class="page-head"><div><h1>Borrow and return</h1><p>Transactions use the 14-day policy and availability rules.</p></div></div><form class="form-card" method="post" th:action="@{/borrowing/borrow}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="bookId">Book</label><select id="bookId" name="bookId" required><option th:each="book : ${books}" th:value="${book.id}" th:text="|${book.title} (${book.availableCopies} available)|">Book</option></select></div><div class="field"><label for="memberId">Member</label><select id="memberId" name="memberId" required><option th:each="member : ${members}" th:value="${member.id}" th:text="${member.fullName}">Member</option></select></div><button class="btn" type="submit">Create loan</button></form><br><div class="table-wrap"><table><thead><tr><th>Book</th><th>Member</th><th>Borrowed</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="loan : ${loans}"><td th:text="${loan.book.title}">Book</td><td th:text="${loan.member.fullName}">Member</td><td th:text="${loan.borrowedAt}">Date</td><td th:text="${loan.dueAt}">Date</td><td><span class="badge" th:text="${loan.status}">ACTIVE</span></td><td><form th:if="${loan.status.name() == 'ACTIVE'}" method="post" th:action="@{/borrowing/{id}/return(id=${loan.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn secondary" type="submit">Return</button></form></td></tr></tbody></table></div></section></main></div></body></html>
