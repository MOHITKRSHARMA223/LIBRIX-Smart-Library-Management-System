<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Catalog entry</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">LIBRARY MANAGEMENT</span><h2 th:text="|New ${kind}|">New entry</h2></div></header><section class="page"><form class="form-card" method="post" th:action="${action}" th:object="${item}"><div class="field"><label for="name">Name</label><input id="name" th:field="*{name}" required><small th:errors="*{name}"></small></div><div class="field"><label for="description">Description</label><textarea id="description" rows="5" th:field="*{description}"></textarea></div><div class="form-actions"><button class="btn" type="submit">Save entry</button><a class="btn secondary" th:href="@{/dashboard}">Cancel</a></div></form></section></main></div></body></html>
