<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${'LIBRIX | ' + kind}">LIBRIX</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">LIBRARY MANAGEMENT</span><h2 th:text="${kind}">Catalog</h2></div></header><section class="page"><div class="page-head"><div><h1 th:text="${kind}">Catalog</h1><p>Maintain reference data used throughout the library.</p></div><a class="btn" th:href="@{${kind == 'Categories' ? '/categories/new' : kind == 'Authors' ? '/authors/new' : '/publishers/new'}}">Add <span th:text="${kind.substring(0, kind.length() - 1).toLowerCase()}">item</span></a></div><p class="notice" th:if="${error}" th:text="${error}"></p><form class="toolbar" method="get"><input name="query" th:value="${query}" placeholder="Search this catalog"><button class="btn secondary" type="submit">Search</button></form><div class="table-wrap"><table><thead><tr><th>Name</th><th>Description / details</th><th>Books linked</th><th>Action</th></tr></thead><tbody><tr th:each="item : ${items}"><td><strong th:text="${item.name}">Name</strong></td><td th:text="${item.description != null ? item.description : 'Reference record'}">Details</td><td th:text="${counts[item.id] != null ? counts[item.id] : '-'}">0</td><td><form method="post" th:action="@{${kind == 'Categories' ? '/categories/' + item.id + '/delete' : kind == 'Authors' ? '/authors/' + item.id + '/delete' : '/publishers/' + item.id + '/delete'}}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn danger" type="submit">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="4">No records found.</td></tr></tbody></table></div></section></main></div></body></html>
