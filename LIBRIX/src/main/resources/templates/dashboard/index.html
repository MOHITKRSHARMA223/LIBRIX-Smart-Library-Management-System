<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Dashboard</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">LIBRARY OPERATIONS</span><h2>Overview</h2></div><span class="user-chip">Live database view</span></header><section class="page"><div class="page-head"><div><h1>Good morning</h1><p>Your library at a glance.</p></div></div><div class="cards"><article class="card metric"><small>Total books</small><strong th:text="${totalBooks}">0</strong></article><article class="card metric"><small>Available copies</small><strong th:text="${availableCopies}">0</strong></article><article class="card metric"><small>Active members</small><strong th:text="${activeMembers}">0</strong></article><article class="card metric"><small>Active loans</small><strong th:text="${activeLoans}">0</strong></article></div><div class="table-wrap"><table><thead><tr><th>Recent activity</th><th>Book</th><th>Member</th><th>Due date</th><th>Status</th></tr></thead><tbody><tr th:each="loan : ${recentLoans}"><td th:text="${loan.borrowedAt}">Today</td><td th:text="${loan.book.title}">Book</td><td th:text="${loan.member.fullName}">Member</td><td th:text="${loan.dueAt}">Due</td><td><span class="badge" th:text="${loan.status}">ACTIVE</span></td></tr><tr th:if="${#lists.isEmpty(recentLoans)}"><td colspan="5">No borrowing activity yet.</td></tr></tbody></table></div></section></main></div></body></html>
