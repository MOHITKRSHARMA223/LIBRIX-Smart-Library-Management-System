<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Add member</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">PEOPLE</span><h2>New member</h2></div></header><section class="page"><form class="form-card" method="post" th:action="@{/members}" th:object="${member}"><div class="field"><label for="fullName">Full name</label><input id="fullName" th:field="*{fullName}" required><small th:errors="*{fullName}"></small></div><div class="field"><label for="email">Email</label><input id="email" type="email" th:field="*{email}" required><small th:errors="*{email}"></small></div><div class="field"><label for="phone">Phone</label><input id="phone" th:field="*{phone}"></div><div class="form-actions"><button class="btn" type="submit">Save member</button><a class="btn secondary" th:href="@{/members}">Cancel</a></div></form></section></main></div></body></html>
