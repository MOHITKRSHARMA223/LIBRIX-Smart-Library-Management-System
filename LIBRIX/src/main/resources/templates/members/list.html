<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Members</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">PEOPLE</span><h2>Members</h2></div></header><section class="page"><div class="page-head"><div><h1>Members</h1><p>Keep member records accurate and active.</p></div><a class="btn" th:href="@{/members/new}">Add member</a></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody><tr th:each="member : ${members}"><td th:text="${member.fullName}">Name</td><td th:text="${member.email}">Email</td><td th:text="${member.phone}">Phone</td><td><span class="badge" th:text="${member.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span></td></tr></tbody></table></div></section></main></div></body></html>
