<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Global search</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app"><aside th:replace="~{fragments/navigation :: sidebar}"></aside><main class="main"><header class="topbar"><div><span class="eyebrow">ADVANCED TOOLS</span><h2>Global search</h2></div></header><section class="page"><div class="page-head"><div><h1>Search everything</h1><p>Search books, members, categories, authors, and publishers from one server-side form.</p></div></div><form class="toolbar" method="get" th:action="@{/search}"><input name="query" th:value="${query}" placeholder="Enter a name, title, email, or author" autofocus><button class="btn" type="submit">Search</button></form><div class="table-wrap"><table><thead><tr><th>Type</th><th>Record</th><th>Details</th></tr></thead><tbody><tr th:each="item : ${books}"><td>Book</td><td th:text="${item.title}">Book</td><td th:text="${item.author}">Author</td></tr><tr th:each="item : ${members}"><td>Member</td><td th:text="${item.fullName}">Member</td><td th:text="${item.email}">Email</td></tr><tr th:each="item : ${categories}"><td>Category</td><td th:text="${item.name}">Category</td><td th:text="${item.description}">Description</td></tr><tr th:each="item : ${authors}"><td>Author</td><td th:text="${item.name}">Author</td><td th:text="${item.country}">Country</td></tr><tr th:each="item : ${publishers}"><td>Publisher</td><td th:text="${item.name}">Publisher</td><td th:text="${item.website}">Website</td></tr><tr th:if="${query != '' and #lists.isEmpty(books) and #lists.isEmpty(members) and #lists.isEmpty(categories) and #lists.isEmpty(authors) and #lists.isEmpty(publishers)}"><td colspan="3">No matching records.</td></tr></tbody></table></div></section></main></div></body></html>
