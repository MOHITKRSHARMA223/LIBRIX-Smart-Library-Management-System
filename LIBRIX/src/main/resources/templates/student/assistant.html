<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library assistant | LIBRIX</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><span class="student-kicker">SMART LIBRARY ASSISTANT</span><h1>Ask LIBRIX.</h1><form class="student-toolbar" method="get" th:action="@{/student/assistant}"><input name="query" th:value="${query}" placeholder="Search a book or ask about borrowing, seats, renewals"><button class="student-btn" type="submit">Search</button></form><article class="notification-card"><strong>Assistant response</strong><p th:text="${answer}">Answer</p></article><section class="book-grid"><article class="book-card" th:each="book : ${results}"><span class="book-category" th:text="${book.category}">Category</span><h3 th:text="${book.title}">Book</h3><p th:text="${book.author}">Author</p></article></section></main></div></body></html>
