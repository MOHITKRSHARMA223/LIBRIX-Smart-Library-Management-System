<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX Explore Books</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><section class="student-hero"><div><span class="student-kicker">DISCOVER</span><h1>Explore books</h1><p>Find something worth staying up late for.</p></div></section><form class="student-toolbar" method="get" th:action="@{/student/catalog}"><input name="query" th:value="${query}" placeholder="Search by title or author"><button class="student-btn" type="submit">Search</button></form><section class="book-grid"><article class="book-card" th:each="book : ${books}"><h3 th:text="${book.title}">Book</h3><p th:text="${book.author}">Author</p><span class="availability" th:text="${book.available ? 'Available to borrow' : 'Currently unavailable'}">Availability</span></article><p th:if="${#lists.isEmpty(books)}">No books matched your search.</p></section></main></div></body></html>
