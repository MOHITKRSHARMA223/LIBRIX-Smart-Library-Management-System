<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book community | LIBRIX</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><span class="student-kicker">BOOK COMMUNITY</span><h1>Share what you learned.</h1><form class="student-field community-form" method="post" th:action="@{/student/community/review}"><label>Review a book</label><select name="bookId" required><option value="">Choose a book</option><option th:each="book : ${books}" th:value="${book.id}" th:text="${book.title}">Book</option></select><input name="rating" type="number" min="1" max="5" placeholder="Rating 1-5" required><textarea name="comment" maxlength="1200" placeholder="Share a helpful review" required></textarea><button class="student-btn" type="submit">Publish review</button></form><section class="notification-list"><article class="notification-card" th:each="review : ${reviews}"><strong th:text="${review.book.title}">Book</strong><span th:text="|${review.rating}/5 by ${review.user.username}|">Rating</span><p th:text="${review.comment}">Review</p></article><p th:if="${#lists.isEmpty(reviews)}" class="muted">Be the first reader to review a book.</p></section></main></div></body></html>
