<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Book exchange | LIBRIX</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><span class="student-kicker">EXCHANGE COMMUNITY</span><h1>Give books another chapter.</h1><form class="student-field community-form" method="post" th:action="@{/student/exchange}"><input name="title" maxlength="180" placeholder="Book or resource title" required><textarea name="description" maxlength="1000" placeholder="Offer, donation, or exchange details" required></textarea><button class="student-btn" type="submit">Post listing</button></form><section class="notification-list"><article class="notification-card" th:each="listing : ${listings}"><strong th:text="${listing.title}">Title</strong><span th:text="${listing.user.username}">Owner</span><p th:text="${listing.description}">Description</p><form method="post" th:if="${listing.user.username.equalsIgnoreCase(username)}" th:action="@{|/student/exchange/${listing.id}/close|}"><button class="student-btn secondary" type="submit">Close listing</button></form></article></section></main></div></body></html>
