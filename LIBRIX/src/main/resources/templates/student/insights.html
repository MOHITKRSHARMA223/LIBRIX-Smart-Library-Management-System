<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reading insights | LIBRIX</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><span class="student-kicker">PERSONAL INSIGHTS</span><h1>Build your learning momentum.</h1><p class="muted">A private snapshot of your reading and study habits.</p><section class="smart-hub insight-hub"><article><span>Average reading progress</span><strong th:text="|${#numbers.formatDecimal(averageProgress, 1, 0)}%|">0%</strong></article><article><span>Completed books</span><strong th:text="${completedBooks}">0</strong></article><article><span>Completed study goals</span><strong th:text="${completedPlans}">0</strong></article><article><span>Planned study minutes</span><strong th:text="${plannedMinutes}">0</strong></article></section><a class="student-btn" th:href="@{/student/dashboard}">Back to dashboard</a></main></div></body></html>
