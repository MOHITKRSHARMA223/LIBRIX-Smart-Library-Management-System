<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX My Library</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><section class="student-hero"><div><span class="student-kicker">YOUR READING LIFE</span><h1>My library</h1><p>Every loan and return, kept in one place.</p></div></section><div class="student-table"><table><thead><tr><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th></tr></thead><tbody><tr th:each="loan : ${loans}"><td th:text="${loan.book.title}">Book</td><td th:text="${loan.borrowedAt}">Date</td><td th:text="${loan.dueAt}">Date</td><td th:text="${loan.status}">Status</td></tr><tr th:if="${#lists.isEmpty(loans)}"><td colspan="4">You have no recorded loans yet.</td></tr></tbody></table></div><h2 id="reservations" class="student-section-title">My reservations</h2><div class="student-table"><table><thead><tr><th>Book</th><th>Requested</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="reservation : ${reservations}"><td th:text="${reservation.book.title}">Book</td><td th:text="${reservation.requestedAt}">Date</td><td th:text="${reservation.status}">REQUESTED</td><td><form th:if="${reservation.status.name() == 'REQUESTED' || reservation.status.name() == 'READY'}" method="post" th:action="@{/student/reservations/{id}/cancel(id=${reservation.id})}"><button class="student-btn secondary" type="submit">Cancel</button></form></td></tr><tr th:if="${#lists.isEmpty(reservations)}"><td colspan="4">No reservations yet. Join a waitlist from Explore books.</td></tr></tbody></table></div></main></div></body></html>
