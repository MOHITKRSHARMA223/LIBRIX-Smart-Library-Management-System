<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Notifications</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><section class="student-hero"><div><span class="student-kicker">YOUR LIBRARY</span><h1>Notifications</h1><p>Important updates about your account, holds, and reading life.</p></div></section><section class="notification-list"><article class="notification-card" th:each="item : ${notifications}" th:classappend="${item.read ? '' : ' unread'}"><div><span class="resource-type" th:text="${item.read ? 'READ' : 'NEW'}">NEW</span><h3 th:text="${item.title}">Notification</h3><p th:text="${item.message}">Message</p><small th:text="${item.createdAt}">Date</small></div><form th:if="${!item.read}" method="post" th:action="@{/student/notifications/{id}/read(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="student-btn secondary" type="submit">Mark read</button></form></article><p th:if="${#lists.isEmpty(notifications)}" class="muted">You are all caught up.</p></section></main></div></body></html>
