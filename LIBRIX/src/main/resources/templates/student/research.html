<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Research hub | LIBRIX</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><span class="student-kicker">RESEARCH REPOSITORY</span><h1>Discover and contribute research.</h1><form class="student-field community-form" method="post" th:action="@{/student/research}"><input name="title" maxlength="240" placeholder="Paper title" required><input name="authors" maxlength="160" placeholder="Authors" required><input name="subject" maxlength="80" placeholder="Subject" required><textarea name="abstractText" maxlength="2000" placeholder="Abstract" required></textarea><button class="student-btn" type="submit">Submit paper</button></form><section class="notification-list"><article class="notification-card" th:each="paper : ${papers}"><strong th:text="${paper.title}">Title</strong><span th:text="|${paper.subject} · ${paper.authors}|">Metadata</span><p th:text="${paper.abstractText}">Abstract</p></article></section></main></div></body></html>
