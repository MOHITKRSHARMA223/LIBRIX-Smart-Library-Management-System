<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LIBRIX | Study resources</title><link rel="stylesheet" th:href="@{/css/student.css}"></head><body><div class="student-shell"><header th:replace="~{fragments/student-navigation :: nav}"></header><main class="student-page"><section class="student-hero"><div><span class="student-kicker">LEARNING STUDIO</span><h1>Study resources</h1><p>Curated guides to help you read, research, and build better ideas.</p></div></section><section class="resource-grid"><article class="resource-card" th:each="resource : ${resources}"><span class="resource-type" th:text="${resource.resourceType}">GUIDE</span><h3 th:text="${resource.title}">Resource</h3><p th:text="${resource.description}">Description</p><a class="student-btn secondary" th:href="${resource.url}" target="_blank" rel="noreferrer">Open resource</a></article></section></main></div></body></html>
